name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        run: |
          mkdir _site
          cp -r "front end/." _site/
          cp "_site/Wordle.html" "_site/index.html"

      - name: Envoyer le frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4